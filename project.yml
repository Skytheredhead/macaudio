name: MacAudio
options:
  minimumXcodeGenVersion: 2.37.0
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: 5.10
    CLANG_C_STANDARD: gnu17
    ARCHS: arm64
    VALID_ARCHS: arm64
    EXCLUDED_ARCHS[sdk=macosx*]: x86_64
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GCC_WARN_64_TO_32_BIT_CONVERSION: YES
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES
    CLANG_WARN_UNGUARDED_AVAILABILITY: YES_AGGRESSIVE
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  MacAudioApp:
    type: application
    platform: macOS
    supportedDestinations: [macOS]
    sources:
      - path: App
        excludes:
          - Info.plist
          - App.entitlements
      - path: AudioEngine
      - path: DSP/Sources
      - path: Shared/Sources
      - path: DSP/include
        buildPhase: headers
        headerVisibility: public
      - path: Shared/include
        buildPhase: headers
        headerVisibility: public
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skylarenns.macaudio
        PRODUCT_NAME: MacAudio
        INFOPLIST_FILE: App/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: App/MacAudio-Bridging-Header.h
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        HEADER_SEARCH_PATHS: $(inherited) $(SRCROOT)/DSP/include $(SRCROOT)/Shared/include
        OTHER_LDFLAGS: $(inherited) -framework Accelerate -framework AudioToolbox -framework AVFoundation -framework CoreAudio
        ENABLE_HARDENED_RUNTIME: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
  VirtualMicDriver:
    type: bundle
    platform: macOS
    supportedDestinations: [macOS]
    sources:
      - path: Driver
        excludes:
          - Info.plist
      - path: Shared/Sources
      - path: Shared/include
        buildPhase: headers
        headerVisibility: public
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skylarenns.macaudio.VirtualMicDriver
        PRODUCT_NAME: VirtualMic
        WRAPPER_EXTENSION: driver
        INFOPLIST_FILE: Driver/Info.plist
        INSTALL_PATH: /Library/Audio/Plug-Ins/HAL
        SKIP_INSTALL: NO
        MACH_O_TYPE: mh_bundle
        HEADER_SEARCH_PATHS: $(inherited) $(SRCROOT)/Shared/include
        OTHER_LDFLAGS: $(inherited) -framework CoreAudio -framework CoreFoundation
        GCC_SYMBOLS_PRIVATE_EXTERN: NO
        MACOSX_DEPLOYMENT_TARGET: "14.0"
  MacAudioTests:
    type: bundle.unit-test
    platform: macOS
    supportedDestinations: [macOS]
    sources:
      - path: Tests
    dependencies:
      - target: MacAudioApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skylarenns.macaudio.tests
        PRODUCT_NAME: MacAudioTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/MacAudio.app/Contents/MacOS/MacAudio
        BUNDLE_LOADER: $(TEST_HOST)
        MACOSX_DEPLOYMENT_TARGET: "14.0"
schemes:
  MacAudio:
    build:
      targets:
        MacAudioApp: all
        VirtualMicDriver: all
        MacAudioTests: [test]
    test:
      config: Debug
      targets:
        - MacAudioTests
    run:
      config: Debug
      executable: MacAudioApp
